apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-bank-api-deployment
  labels:
    app: simple-bank-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-bank-api
  template:
    metadata:
      labels:
        app: simple-bank-api
    spec:
      # Init container ensures the DB is reachable before the API starts
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -zv postgres 5432; do echo waiting for postgres; sleep 2; done;']
      
      containers:
      - name: simple-bank-api
        image: 252380158032.dkr.ecr.us-east-1.amazonaws.com/simplebank:34bfbd8f93c9741beb08705532f3aae9d106eb7a
        # Merged command and args here
        command: ["/app/start.sh"]
        args: ["/app/main"] 
        ports:
        - containerPort: 8080
        env:
          - name: DB_URL
            value: "postgresql://root:secret@postgres:5432/simple_bank?sslmode=disable"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"